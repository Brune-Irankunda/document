<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <form action="/submit" method="POST" class="form-container">
      <div class="form-group">
        <label for="Full Name"> Full Name: </label>
        <input
          type="text"
          name="Full Name"
          placeholder="Enter your full Name....."
          required
        />
      </div>

      <div class="form-group">
        <label for="Email"> Email: </label>
        <input
          type="email"
          name="Email"
          placeholder="Enter your email....."
          required
        />
      </div>

      <div class="form-group">
        <label for="Phone Number"> Phone Number: </label>

        <input
          type="tel"
          name="Phone Number"
          placeholder="Enter Your phone number ...."
          required
        />
      </div>

      <div class="form-group">
        <label for="Subject category"> Subject category </label>

        <select name="Subject category" id="form-group-select">
          <option value="select">Select a subject category</option>
          <option value="customer-support">Customer Support</option>
          <option value="sales-inquiry">Sales Inquiry</option>
          <option value="general-question">General Question</option>
        </select>

        <fieldset>
          <legend>Preferred Contact Method:</legend>
         
        </fieldset>


        <div class="form-group">
          <label for="message">Message:</label>
          <textarea
            name="message"
            rows="4"
            cols="50"
            placeholder="Write your message..."
            required
          ></textarea>
        </div>


        <div class="form-btn">
          <button type="submit">Submit form</button>
          <button type="reset">Reset form</button>
        </div>
      </div>
    </form>
  </body>
</html>
